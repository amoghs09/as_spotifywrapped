<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500;1,600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efe9dc;
    --paper: #f6f2e8;
    --ink: #23201b;
    --ink-soft: #6b6459;
    --teal: #1f6f5c;
    --mustard: #d9a62e;
    --brick: #a6432a;
    --line: rgba(35, 32, 27, 0.18);
    --font-display: 'Fraunces', serif;
    --font-body: 'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: clamp(28px, 6vw, 64px) clamp(20px, 5vw, 32px) 80px;
  }

  header {
    margin-bottom: clamp(32px, 6vw, 52px);
  }

  h1 {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: clamp(2.4rem, 7vw, 3.4rem);
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: 1.05rem;
    color: var(--ink-soft);
    max-width: 46ch;
    line-height: 1.5;
    margin: 0;
  }

  .rule {
    border: none;
    border-top: 1.5px solid var(--ink);
    margin: 28px 0 0;
  }

  /* --- Upload zone --- */
  .dropzone {
    position: relative;
    border: 2px solid var(--ink);
    background: var(--paper);
    padding: clamp(28px, 6vw, 44px) 24px;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .dropzone:hover,
  .dropzone.dragover {
    background: #fffdf7;
    border-color: var(--teal);
  }

  .dropzone.dragover {
    background: #eef6f3;
  }

  .dropzone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .dropzone svg {
    width: 44px;
    height: 44px;
    margin-bottom: 14px;
    color: var(--teal);
  }

  .dropzone-label {
    font-size: 1.1rem;
    font-weight: 500;
  }

  .dropzone-sub {
    color: var(--ink-soft);
    font-size: 0.9rem;
    margin-top: 6px;
  }

  .dropzone-sub code {
    background: var(--line);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: var(--font-body);
  }

  /* --- File chips --- */
  .file-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
  }

  .file-chip {
    border: 1.5px solid var(--ink);
    padding: 6px 12px;
    font-size: 0.85rem;
    background: var(--paper);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .file-chip .size {
    color: var(--ink-soft);
  }

  /* --- Status states --- */
  .status {
    margin-top: 20px;
    font-size: 0.95rem;
    color: var(--ink-soft);
    display: none;
    align-items: center;
    gap: 10px;
  }

  .status.visible { display: flex; }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2.5px solid var(--line);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    margin-top: 20px;
    border-left: 3px solid var(--brick);
    padding: 12px 16px;
    background: rgba(166, 67, 42, 0.07);
    color: var(--brick);
    font-size: 0.92rem;
    line-height: 1.5;
    display: none;
  }

  .error-box.visible { display: block; }

  /* --- Summary card --- */
  .summary {
    margin-top: 32px;
    display: none;
  }

  .summary.visible { display: block; }

  .summary-stat {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2rem, 6vw, 2.6rem);
    line-height: 1.1;
  }

  .summary-stat .accent { color: var(--teal); }

  .summary-range {
    margin-top: 6px;
    color: var(--ink-soft);
    font-size: 1rem;
  }

  .summary-footnote {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 0.9rem;
    color: var(--ink-soft);
  }

  .reset-link {
    background: none;
    border: none;
    font-family: var(--font-body);
    font-size: 0.85rem;
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 0;
    margin-top: 14px;
  }

  .reset-link:hover { color: var(--teal); }

  :focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="page">
  <header>
    <h1>Track Record</h1>
    <p class="subtitle">Upload your Spotify extended streaming history and see your year in listening — top songs, top artists, and the day you played the most.</p>
  </header>

  <hr class="rule">

  <div style="margin-top: 28px;">
    <label class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept="application/json,.json" multiple>
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="2"/>
        <circle cx="24" cy="24" r="3" fill="currentColor"/>
        <path d="M24 9 V4 M24 44 V39" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="dropzone-label">Drop your streaming history here, or click to browse</div>
      <div class="dropzone-sub">Looks for files like <code>Streaming_History_Audio_*.json</code> — you can select more than one</div>
    </label>

    <div class="file-list" id="fileList"></div>

    <div class="status" id="statusBox">
      <div class="spinner"></div>
      <span id="statusText">Reading your files…</span>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="summary" id="summaryBox">
      <div class="summary-stat"><span class="accent" id="summaryCount">0</span> streams loaded</div>
      <div class="summary-range" id="summaryRange"></div>

      <div class="controls" id="controlsBox">
        <div class="control-field">
          <label for="startDate">From</label>
          <input type="date" id="startDate">
        </div>
        <div class="control-field">
          <label for="endDate">To</label>
          <input type="date" id="endDate">
        </div>
        <div class="control-field">
          <label for="topN">Show top</label>
          <input type="number" id="topN" min="1" max="25" value="5">
        </div>
      </div>

      <div class="summary-footnote">Next up: pick a date range and choose how many top songs and artists to show.</div>
      <button class="reset-link" id="resetBtn">Load different file(s)</button>
    </div>
  </div>
</div>

<script>
  // ---- App state ----
  // `allEntries` holds the combined, parsed streaming history from every
  // file the person has uploaded. Later steps (date filtering, top-N
  // controls, stats rendering) will all read from this array.
  let allEntries = [];

  // ---- DOM references ----
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const fileListEl = document.getElementById('fileList');
  const statusBox = document.getElementById('statusBox');
  const statusText = document.getElementById('statusText');
  const errorBox = document.getElementById('errorBox');
  const summaryBox = document.getElementById('summaryBox');
  const summaryCount = document.getElementById('summaryCount');
  const summaryRange = document.getElementById('summaryRange');
  const resetBtn = document.getElementById('resetBtn');

  // ---- Drag & drop visuals ----
  ['dragenter', 'dragover'].forEach(evt =>
    dropzone.addEventListener(evt, e => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    })
  );
  ['dragleave', 'drop'].forEach(evt =>
    dropzone.addEventListener(evt, e => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
    })
  );
  dropzone.addEventListener('drop', e => {
    if (e.dataTransfer.files.length) {
      fileInput.files = e.dataTransfer.files;
      handleFiles(e.dataTransfer.files);
    }
  });
  fileInput.addEventListener('change', () => handleFiles(fileInput.files));

  resetBtn.addEventListener('click', () => {
    allEntries = [];
    fileInput.value = '';
    fileListEl.innerHTML = '';
    hide(summaryBox);
    hide(errorBox);
  });

  function show(el) { el.classList.add('visible'); }
  function hide(el) { el.classList.remove('visible'); }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function renderFileChips(files) {
    fileListEl.innerHTML = '';
    Array.from(files).forEach(f => {
      const chip = document.createElement('div');
      chip.className = 'file-chip';
      chip.innerHTML = `<span>${f.name}</span><span class="size">${formatSize(f.size)}</span>`;
      fileListEl.appendChild(chip);
    });
  }

  async function handleFiles(fileList) {
    hide(errorBox);
    hide(summaryBox);
    renderFileChips(fileList);

    statusText.textContent = 'Reading your files…';
    show(statusBox);

    try {
      const parsedArrays = await Promise.all(
        Array.from(fileList).map(readAndParseFile)
      );
      allEntries = parsedArrays.flat();

      validateEntries(allEntries);
      hide(statusBox);
      renderSummary(allEntries);
      debugLogAnalysis(allEntries); // TEMPORARY: see step 2 note above
    } catch (err) {
      hide(statusBox);
      showError(err.message);
    }
  }

  function readAndParseFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!Array.isArray(data)) {
            throw new Error(`"${file.name}" doesn't look like a Spotify history file — expected a list of streaming records.`);
          }
          resolve(data);
        } catch (e) {
          reject(new Error(`Couldn't read "${file.name}" as JSON. Make sure it's an unedited export from Spotify.`));
        }
      };
      reader.onerror = () => reject(new Error(`Couldn't open "${file.name}".`));
      reader.readAsText(file);
    });
  }

  function validateEntries(entries) {
    if (entries.length === 0) {
      throw new Error('No streaming records found in the file(s) you uploaded.');
    }
    const sample = entries[0];
    if (!('ts' in sample) || !('ms_played' in sample)) {
      throw new Error('These files are missing fields Spotify normally includes (like "ts" or "ms_played"). Make sure you\'re uploading the extended streaming history export.');
    }
  }

  function showError(message) {
    errorBox.textContent = message;
    show(errorBox);
  }

  function renderSummary(entries) {
    const dates = entries
      .map(e => e.ts)
      .filter(Boolean)
      .sort();
    const earliest = dates[0]?.slice(0, 10);
    const latest = dates[dates.length - 1]?.slice(0, 10);

    summaryCount.textContent = entries.length.toLocaleString();
    summaryRange.textContent = earliest && latest
      ? `Spanning ${formatDate(earliest)} to ${formatDate(latest)}`
      : '';
    show(summaryBox);

    if (earliest && latest) {
      initControls(earliest, latest);
    }
  }

  function formatDate(isoDate) {
    const d = new Date(isoDate + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  const MIN_MS_PLAYED = 30_000; // min "play" time

  // JS map keys need to be a single value, so join pair into one string
  function songKey(track, artist) {
    return `${track}\u0000${artist}`;
  }
  function parseSongKey(key) {
    const [track, artist] = key.split('\u0000');
    return { track, artist };
  }

  // Same as Python's in_date_range()
  function inDateRange(ts, start, end) {
    const dateStr = ts.slice(0, 10);
    if (start && dateStr < start) return false;
    if (end && dateStr > end) return false;
    return true;
  }

  // Same as Python's filter_by_date().
  function filterByDateRange(entries, start, end) {
    if (!start && !end) return entries;
    return entries.filter(e => inDateRange(e.ts, start, end));
  }

  // Same as Python's analyze()
  function analyzeEntries(entries) {
    const songPlays = new Map();   // songKey(track, artist) -> play count
    const artistMs = new Map();    // artist -> total ms played
    const dayMs = new Map();       // "YYYY-MM-DD" -> total ms played that day
    let totalMs = 0;               // total ms played across everything

    for (const e of entries) {
      const track = e.master_metadata_track_name;
      const artist = e.master_metadata_album_artist_name;
      const msPlayed = e.ms_played || 0;

      // Total listening time counts everything: songs, podcasts, audiobooks
      totalMs += msPlayed;

      // Tally listening time by calendar day (also counts everything)
      const dayStr = (e.ts || '').slice(0, 10);
      if (dayStr) {
        dayMs.set(dayStr, (dayMs.get(dayStr) || 0) + msPlayed);
      }

      // Skip podcasts, audiobooks, or entries missing track/artist info
      if (!track || !artist) continue;

      // Count towards total listening time for the artist regardless of length
      artistMs.set(artist, (artistMs.get(artist) || 0) + msPlayed);

      // Only count as a "play" if listened past the minimum threshold
      if (msPlayed >= MIN_MS_PLAYED) {
        const key = songKey(track, artist);
        songPlays.set(key, (songPlays.get(key) || 0) + 1);
      }
    }

    return { songPlays, artistMs, dayMs, totalMs };
  }

  function msToMinutes(ms) {
    return ms / 60_000;
  }

  // Same as Python's print_top_songs()
  function getTopSongs(songPlays, topN = 5) {
    return Array.from(songPlays.entries())
      .map(([key, plays]) => ({ ...parseSongKey(key), plays }))
      .sort((a, b) => b.plays - a.plays)
      .slice(0, topN);
  }

  // Same as Python's print_top_artists().
  function getTopArtists(artistMs, topN = 5) {
    return Array.from(artistMs.entries())
      .map(([artist, ms]) => ({ artist, minutes: msToMinutes(ms) }))
      .sort((a, b) => b.minutes - a.minutes)
      .slice(0, topN);
  }

  // Same as Python's print_top_day().
  function getTopDay(dayMs) {
    let topDay = null;
    let topMs = -1;
    for (const [day, ms] of dayMs.entries()) {
      if (ms > topMs) {
        topMs = ms;
        topDay = day;
      }
    }
    return topDay ? { day: topDay, minutes: msToMinutes(topMs) } : null;
  }

  const startDateInput = document.getElementById('startDate');
  const endDateInput = document.getElementById('endDate');
  const topNInput = document.getElementById('topN');
 
  // Populate the date pickers with the range actually found in the
  // uploaded data, and constrain min/max so an out-of-range date can't
  // be picked. Called from renderSummary() once a file is loaded.
  function initControls(earliest, latest) {
    [startDateInput, endDateInput].forEach(input => {
      input.min = earliest;
      input.max = latest;
    });
    startDateInput.value = earliest;
    endDateInput.value = latest;
    topNInput.value = 5;
  }
 
  // If the person drags "From" past "To" (or vice versa), nudge the
  // other field to match rather than allowing an inverted range.
  function clampDateRange(changedField) {
    if (startDateInput.value && endDateInput.value && startDateInput.value > endDateInput.value) {
      if (changedField === 'start') {
        endDateInput.value = startDateInput.value;
      } else {
        startDateInput.value = endDateInput.value;
      }
    }
  }
 
  function currentControlValues() {
    return {
      start: startDateInput.value || null,
      end: endDateInput.value || null,
      topN: Math.max(1, parseInt(topNInput.value, 10) || 5),
    };
  }
 
  startDateInput.addEventListener('change', () => {
    clampDateRange('start');
    runAnalysisPreview();
  });
  endDateInput.addEventListener('change', () => {
    clampDateRange('end');
    runAnalysisPreview();
  });
  topNInput.addEventListener('input', runAnalysisPreview);
 

  // TEMP : run the full analysis as soon as a file
  // loads, using the whole date range and top 5, and log the results to
  // the browser console (F12 → Console) so the logic can be checked
  // against real data. 
function runAnalysisPreview() {
    if (allEntries.length === 0) return;
 
    const { start, end, topN } = currentControlValues();
    const filtered = filterByDateRange(allEntries, start, end);
    const { songPlays, artistMs, dayMs, totalMs } = analyzeEntries(filtered);
 
    console.log(`--- Track Record: debug output (${start || 'start'} to ${end || 'end'}, top ${topN}) ---`);
    console.log(`Top ${topN} songs:`);
    console.table(getTopSongs(songPlays, topN));
 
    console.log(`Top ${topN} artists:`);
    console.table(
      getTopArtists(artistMs, topN).map(a => ({ artist: a.artist, minutes: a.minutes.toFixed(1) }))
    );
 
    console.log(`Total minutes: ${msToMinutes(totalMs).toFixed(1)}`);
 
    const topDay = getTopDay(dayMs);
    console.log('Top day:', topDay ? `${topDay.day} — ${topDay.minutes.toFixed(1)} minutes` : 'n/a');
  }
</script>

</body>
</html>
